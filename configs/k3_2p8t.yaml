# Kimi K3 -- the paper's 2.8T configuration (arXiv:2607.24653v1, Table 1).
name: k3_2p8t

model:
  dim: 7168
  n_layers: 93              # 23 x [KDA KDA KDA MLA] + 1 trailing Gated MLA
  vocab_size: 160000
  hybrid_ratio: 3
  trailing_global: true
  n_dense_layers: 1
  dense_ffn_hidden: 18432
  tie_embeddings: true

  kda:
    num_heads: 96
    head_dim_k: 128
    head_dim_v: 128
    alpha_rank: 512
    conv_kernel: 4
    chunk_size: 64
    tile_size: 16
    g_min: -5.0
    alpha_init: 0.99

  mla:
    num_heads: 96
    qk_head_dim: 128
    v_head_dim: 128
    q_lora_rank: 1536
    kv_lora_rank: 512
    attn_out_fp32: true

  moe:
    n_routed: 896
    n_shared: 2
    top_k: 16
    latent_dim: 3584
    expert_hidden: 3072
    shared_hidden: 3072
    situ_beta_gate: 4.0
    situ_beta_up: 25.0
    rmsnorm_before_up: true
    qb_enabled: true
    qb_bins: 1000

  attn_res:
    enabled: true
    block_size: 12
    granularity: sublayer

  mtp:
    enabled: true
    n_layers: 1
    layer_kind: mla

  vit:
    enabled: true
    n_layers: 27
    dim: 1152
    num_heads: 12
    patch_size: 14
    mlp_hidden: 4128
    pixel_shuffle: 2
    factorized_attention: true

train:
  steps: 1000000
  dtype: bfloat16
  gradient_checkpointing: true
  curriculum: [8192, 65536, 262144, 1048576]
  curriculum_step_fractions: [0.6, 0.85, 0.95, 1.0]
  optim:
    lr: 0.0006
    weight_decay: 0.1
    schedule: cosine
    warmup_ratio: 0.01
    per_head: true
  data:
    tokenizer: hf
    seq_len: 8192
    micro_batch_size: 1
    vision_fraction: 0.25
  parallel:
    pp: 16
    ep: 32
    cp: 8
    zero_stage: 2
    pipeline_zero2: true
    offload_grads_to_cpu: true
    activation_policy: fp8
    muon_p2p: true
    moonep: true
    virtual_pipeline_stages: 2
